{% comment %}News card cover: first media of the news. Params: media, alt, classes, eager (above-the-fold cover).{% endcomment %}
{% if media.is_video %}
    <div class="relative overflow-hidden bg-black {{ classes }}">
        <video data-src="{{ media.file.url }}#t=0.1" class="w-full h-full object-cover" preload="none" muted playsinline></video>
        <div class="absolute inset-0 flex items-center justify-center bg-black/20">
            <span class="material-symbols-outlined text-white bg-[#ff5a00] rounded-full p-3 group-hover:scale-110 transition-transform" style="font-size:28px;">play_arrow</span>
        </div>
    </div>
{% elif media %}
    <img src="{{ media.file.url }}" alt="{{ alt }}" class="object-cover object-top {{ classes }}" {% if eager %}fetchpriority="high"{% else %}loading="lazy" decoding="async"{% endif %}/>
{% else %}
    <div class="bg-white/5 flex items-center justify-center {{ classes }}">
        <span class="material-symbols-outlined text-white/20" style="font-size:48px;">image</span>
    </div>
{% endif %}
