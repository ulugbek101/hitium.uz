{% comment %}Video review bento tile, opens components/_video_modal.html. Params: review, span.{% endcomment %}
<div class="{{ span }} js-video relative overflow-hidden rounded-xl bg-black cursor-pointer group"
     data-src="{{ review.video.url }}" data-title="{{ review.fullname }}">
    <video data-src="{{ review.video.url }}#t=0.1" class="absolute inset-0 w-full h-full object-cover" preload="none" muted playsinline></video>
    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
    <span class="material-symbols-outlined absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white bg-[#ff5a00] rounded-full p-3 group-hover:scale-110 transition-transform" style="font-size:28px;">play_arrow</span>
    <h3 class="absolute inset-x-0 bottom-0 p-3 lg:p-4 font-accent font-semibold text-sm lg:text-base text-white line-clamp-2">{{ review.fullname }}</h3>
</div>
